name: FB-4047 live gallery audit

on:
  push:
    branches:
      - feat/product-table-layout
    paths:
      - ".github/workflows/fb4047-live-gallery-audit.yml"
      - "tools/audit_fb4047_live_gallery.py"

permissions:
  contents: read

jobs:
  audit-live-gallery:
    name: Scrape and verify FB-4047 gallery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install scraping dependencies
        run: python -m pip install requests beautifulsoup4 lxml pillow

      - name: Fetch product page and download gallery using project scraper
        run: python tools/audit_fb4047_live_gallery.py --output-dir audit-output

      - name: Publish JSON, contact sheet, and verified image files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb4047-live-gallery-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 3
