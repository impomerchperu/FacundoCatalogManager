name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Pyright
        run: python -m pyright

      - name: Pytest
        run: python -m pytest -q

  live-catalog:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate live FULL coverage
        run: python -m pytest tests/scraping/real_site/test_full_catalog_scraper.py -q -m real_site

  live-fb4047-gallery:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/product-table-layout'
    name: Scrape current FB-4047 gallery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install scraping dependencies
        run: python -m pip install requests beautifulsoup4 lxml pillow

      - name: Fetch product page and verify image files
        run: python -m tools.audit_fb4047_live_gallery --output-dir audit-output

      - name: Publish audit report and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb4047-live-gallery-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 3

