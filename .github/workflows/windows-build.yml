name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt

      - name: Prepare validated Windows seed
        shell: pwsh
        run: python -m tools.prepare_windows_seed --output build\\WindowsSeed

      - name: Build PyInstaller bundle
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm packaging\\fcm.spec

      - name: Validate Windows bundle
        shell: pwsh
        run: |
          $exe = "dist\\Windows\\FacundoCatalogManager\\FacundoCatalogManager.exe"
          if (-not (Test-Path $exe)) {
            throw "No se encontró el ejecutable esperado: $exe"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e --accept-source-agreements --accept-package-agreements --silent

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          if ($version -notmatch "^\d+\.\d+\.\d+$") {
            throw "VERSION debe usar el formato MAJOR.MINOR.PATCH."
          }

          $iscc = @(
            "$env:ProgramFiles(x86)\\Inno Setup 7\\ISCC.exe",
            "$env:ProgramFiles\\Inno Setup 7\\ISCC.exe",
            "$env:LOCALAPPDATA\\Programs\\Inno Setup 7\\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $command = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($command) {
              $iscc = $command.Source
            }
          }

          if (-not $iscc) {
            throw "No se encontró Inno Setup 7 después de la instalación."
          }

          & $iscc "/DFCM_VERSION=$version" packaging\\installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup no pudo generar el instalador."
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          $files = @(
            "dist\\Windows\\FacundoCatalogManager\\FacundoCatalogManager.exe",
            "dist\\Windows\\FacundoCatalogManager-$version-setup.exe"
          )

          $hashes = foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "No se encontró el artefacto esperado: $file"
            }

            $hash = Get-FileHash -Algorithm SHA256 $file
            "$($hash.Hash)  $file"
          }

          $hashes | Set-Content dist\\Windows\\SHA256SUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FacundoCatalogManager-Windows-${{ github.run_number }}
          path: |
            dist/Windows/FacundoCatalogManager/**
            dist/Windows/FacundoCatalogManager-*-setup.exe
            dist/Windows/SHA256SUMS.txt
          if-no-files-found: error
