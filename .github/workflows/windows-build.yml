name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt

      - name: Build PyInstaller bundle
        shell: pwsh
        run: python -m pyinstaller --clean --noconfirm packaging\fcm.spec

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e --accept-source-agreements --accept-package-agreements --silent

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            throw "No se encontró Inno Setup 7 después de la instalación."
          }

          & $iscc packaging\installer.iss

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @(
            "dist\Windows\FacundoCatalogManager\FacundoCatalogManager.exe",
            "dist\Windows\FacundoCatalogManager-0.1.0-setup.exe"
          )

          $hashes = foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "No se encontró el artefacto esperado: $file"
            }

            $hash = Get-FileHash -Algorithm SHA256 $file
            "$($hash.Hash)  $file"
          }

          $hashes | Set-Content dist\Windows\SHA256SUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FacundoCatalogManager-Windows-0.1.0
          path: |
            dist/Windows/FacundoCatalogManager/**
            dist/Windows/FacundoCatalogManager-0.1.0-setup.exe
            dist/Windows/SHA256SUMS.txt
          if-no-files-found: error
