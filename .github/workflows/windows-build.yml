name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt

      - name: Prepare CI packaging seed
        shell: pwsh
        run: |
          $seedRoot = "build\\WindowsSeed"
          $seedDatabase = "$seedRoot\\database\\catalog.db"
          $seedImages = "$seedRoot\\data\\images"

          Remove-Item -Recurse -Force $seedRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$seedRoot\\database" | Out-Null
          New-Item -ItemType Directory -Force $seedImages | Out-Null

          @'
          from pathlib import Path
          import sqlite3

          root = Path.cwd()
          schema = root / "database" / "schema.sql"
          database = root / "build" / "WindowsSeed" / "database" / "catalog.db"

          with sqlite3.connect(database) as connection:
              connection.executescript(schema.read_text(encoding="utf-8"))
              connection.execute(
                  "INSERT OR REPLACE INTO catalog_metadata(key, value) VALUES (?, ?)",
                  ("seed_kind", "ci-packaging-smoke"),
              )
              integrity = connection.execute(
                  "PRAGMA integrity_check"
              ).fetchone()[0]

          if integrity != "ok":
              raise RuntimeError(f"CI seed integrity check failed: {integrity}")

          print(f"CI seed created: {database}")
          '@ | python -

          if (-not (Test-Path $seedDatabase)) {
            throw "No se creó la semilla CI: $seedDatabase"
          }

          if (-not (Test-Path $seedImages)) {
            throw "No se creó el directorio de imágenes CI: $seedImages"
          }

      - name: Build PyInstaller bundle
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm packaging\\fcm.spec

      - name: Validate Windows bundle
        shell: pwsh
        run: |
          $exe = "dist\\Windows\\FacundoCatalogManager\\FacundoCatalogManager.exe"
          $seedDatabase = "dist\\Windows\\FacundoCatalogManager\\_internal\\seed\\database\\catalog.db"
          $seedImages = "dist\\Windows\\FacundoCatalogManager\\_internal\\seed\\data\\images"

          if (-not (Test-Path $exe)) {
            throw "No se encontró el ejecutable esperado: $exe"
          }

          if (-not (Test-Path $seedDatabase)) {
            throw "No se encontró la semilla CI empaquetada: $seedDatabase"
          }

          if (-not (Test-Path $seedImages)) {
            throw "No se encontró el directorio de imágenes semilla: $seedImages"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup.7 -e --accept-source-agreements --accept-package-agreements --silent

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          if ($version -notmatch "^\d+\.\d+\.\d+$") {
            throw "VERSION debe usar el formato MAJOR.MINOR.PATCH."
          }

          $iscc = @(
            "$env:ProgramFiles(x86)\\Inno Setup 7\\ISCC.exe",
            "$env:ProgramFiles\\Inno Setup 7\\ISCC.exe",
            "$env:LOCALAPPDATA\\Programs\\Inno Setup 7\\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            $command = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($command) {
              $iscc = $command.Source
            }
          }

          if (-not $iscc) {
            throw "No se encontró Inno Setup 7 después de la instalación."
          }

          & $iscc "/DFCM_VERSION=$version" packaging\\installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup no pudo generar el instalador."
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = (Get-Content "VERSION" -Raw).Trim()
          $files = @(
            "dist\\Windows\\FacundoCatalogManager\\FacundoCatalogManager.exe",
            "dist\\Windows\\FacundoCatalogManager-$version-setup.exe"
          )

          $hashes = foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "No se encontró el artefacto esperado: $file"
            }

            $hash = Get-FileHash -Algorithm SHA256 $file
            "$($hash.Hash)  $file"
          }

          $hashes | Set-Content dist\\Windows\\SHA256SUMS.txt

      - name: Upload Windows CI artifacts
        uses: actions/upload-artifact@v6
        with:
          name: FacundoCatalogManager-Windows-CI-${{ github.run_number }}
          path: |
            dist/Windows/FacundoCatalogManager/**
            dist/Windows/FacundoCatalogManager-*-setup.exe
            dist/Windows/SHA256SUMS.txt
          if-no-files-found: error
